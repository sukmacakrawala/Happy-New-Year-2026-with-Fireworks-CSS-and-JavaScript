<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy New Year 2026 with Fireworks CSS and JavaScript</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Rubik+Wet+Paint&family=Bebas+Neue&family=Orbitron:wght@700;900&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="year-display" id="yearDisplay">2026</div>
      <div class="greeting">
        <span class="happy">HAPPY</span>
        <span class="new">NEW</span>
        <span class="year">YEAR</span>
      </div>
      <div class="subtitle">Welcome to 2026!</div>
    </div>

    <!-- Canvas untuk efek kembang api -->
    <canvas id="fireworksCanvas"></canvas>

    <script src="script.js"></script>
  </body>
</html>
